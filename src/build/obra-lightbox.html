    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Vista ampliada"
      hidden
    >
      <div class="lightbox-backdrop" data-close-lightbox></div>
      <div class="lightbox-panel">
        <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Cerrar">×</button>
        <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">‹</button>
        <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">›</button>
        <figure class="lightbox-figure">
          <img id="lightbox-img" src="" alt="" />
          <figcaption class="lightbox-caption">
            <p id="lightbox-title"></p>
            <p class="lightbox-meta">
              <span id="lightbox-price"></span>
              <a id="lightbox-link" href="#" target="_blank" rel="noopener noreferrer">Ficha completa →</a>
            </p>
          </figcaption>
        </figure>
      </div>
    </div>
